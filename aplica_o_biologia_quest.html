<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biologia Quest | Ensino Médio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti para comemorações -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Barra Navegação -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router('home')">
                <div class="bg-gradient-to-tr from-emerald-600 to-teal-400 text-white p-2.5 rounded-2xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-dna text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">BIOLOGIA QUEST</h1>
                    <p class="text-xs text-slate-500 font-medium">2º Ano do Ensino Médio</p>
                </div>
            </div>

            <!-- Gamificação Header -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="flex items-center space-x-1 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-full shadow-sm">
                    <i class="fa-solid fa-bolt text-amber-500"></i>
                    <span id="streak-count" class="font-bold text-amber-700 text-sm">0</span>
                    <span class="text-xs text-amber-600 hidden sm:inline">dias</span>
                </div>
                <div class="flex items-center space-x-1 bg-purple-50 border border-purple-200 px-3 py-1.5 rounded-full shadow-sm">
                    <i class="fa-solid fa-star text-purple-500"></i>
                    <span id="xp-count" class="font-bold text-purple-700 text-sm">0</span>
                    <span class="text-xs text-purple-600 hidden sm:inline">XP</span>
                </div>
                <div class="hidden md:flex items-center space-x-1 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm">
                    <i class="fa-solid fa-graduation-cap text-emerald-600"></i>
                    <span id="level-badge" class="font-bold text-emerald-700 text-sm">Nível 1</span>
                </div>
                <button onclick="router('profile')" class="bg-slate-100 hover:bg-slate-200 p-2 rounded-xl text-slate-700 transition" title="Perfil e Conquistas">
                    <i class="fa-solid fa-trophy text-amber-600"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Container Principal -->
    <main id="app" class="flex-grow max-w-7xl mx-auto w-full px-4 py-6">
        <!-- Conteúdo Dinâmico via JavaScript -->
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
            <p>🧬 BIOLOGIA QUEST — Plataforma Educativa Interativa.</p>
            <p>Desenvolvido para o 2º ano do Ensino Médio.</p>
        </div>
    </footer>

    <!-- Script da Aplicação -->
    <script>
        const STORAGE_KEY = 'biologia_quest_state_v1';
        let state = {
            xp: 0,
            level: 1,
            streak: 1,
            completedLessons: [],
            quizScores: {},
            lastActiveDate: new Date().toDateString()
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    const today = new Date().toDateString();
                    if (state.lastActiveDate !== today) {
                        state.lastActiveDate = today;
                        saveState();
                    }
                } catch(e) { console.error(e); }
            } else {
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateHeaderStats();
        }

        function addXP(amount) {
            state.xp += amount;
            state.level = Math.floor(state.xp / 150) + 1;
            saveState();
            triggerConfetti();
        }

        function updateHeaderStats() {
            document.getElementById('streak-count').innerText = state.streak;
            document.getElementById('xp-count').innerText = state.xp;
            document.getElementById('level-badge').innerText = `Nível ${state.level}`;
        }

        function triggerConfetti() {
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        }

        const modulesData = {
            1: {
                id: 1,
                title: "Desenvolvimento Embrionário",
                icon: "fa-dna",
                color: "from-emerald-500 to-teal-600",
                description: "Da fecundação à formação dos tecidos, órgãos e folhetos germinativos.",
                lessons: [
                    {
                        id: "mod1_aula1",
                        title: "Aula 1: Fecundação",
                        content: `
                            <h3 class="text-xl font-bold text-emerald-700 mb-3">O que é a Fecundação?</h3>
                            <p class="mb-4">União do gameta masculino (espermatozoide) com o feminino (ovócito II), gerando o <strong>zigoto (2n)</strong>.</p>
                            <div class="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-xl mb-4">
                                <h4 class="font-bold text-emerald-800 mb-1"><i class="fa-solid fa-lightbulb mr-2"></i>Curiosidade:</h4>
                                <p class="text-sm text-emerald-900">Apenas um espermatozoide atravessa a zona pelúcida via reação acrossômica.</p>
                            </div>
                            <h4 class="font-bold text-slate-700 mt-4 mb-2">Fecundação Interna vs Externa</h4>
                            <ul class="list-disc pl-5 space-y-2 mb-4 text-slate-700">
                                <li><strong>Externa:</strong> Meio aquático (ex: peixes e anfíbios).</li>
                                <li><strong>Interna:</strong> Trato genital feminino (ex: mamíferos, aves, répteis).</li>
                            </ul>
                        `,
                        summary: "Fecundação une espermatozoide e óvulo formando o zigoto (2n)."
                    },
                    {
                        id: "mod1_aula2",
                        title: "Aula 2: Segmentação ou Clivagem",
                        content: `
                            <h3 class="text-xl font-bold text-emerald-700 mb-3">Segmentação</h3>
                            <p class="mb-4">Sucessivas divisões mitóticas sem aumento do volume total do embrião.</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div class="bg-white p-4 rounded-xl border border-slate-200">
                                    <h5 class="font-bold text-slate-800">Mórula</h5>
                                    <p class="text-sm text-slate-600">Massa celular compacta semelhante a uma amora.</p>
                                </div>
                                <div class="bg-white p-4 rounded-xl border border-slate-200">
                                    <h5 class="font-bold text-slate-800">Blástula</h5>
                                    <p class="text-sm text-slate-600">Esfera oca com cavidade fluida (blastocela).</p>
                                </div>
                            </div>
                        `,
                        summary: "Segmentação gera blastômeros, formando a mórula e depois a blástula."
                    },
                    {
                        id: "mod1_aula3",
                        title: "Aula 3: Gastrulação",
                        content: `
                            <h3 class="text-xl font-bold text-emerald-700 mb-3">Gastrulação</h3>
                            <p class="mb-4">Formação dos três folhetos germinativos e do arquêntero (intestino primitivo).</p>
                            <ul class="space-y-2 text-sm text-slate-700 bg-slate-100 p-4 rounded-xl">
                                <li><strong>Ectoderma:</strong> Epiderme e sistema nervoso.</li>
                                <li><strong>Mesoderma:</strong> Músculos, ossos, sistema circulatório e excretor.</li>
                                <li><strong>Endoderma:</strong> Revestimento do sistema digestório e respiratório.</li>
                            </ul>
                        `,
                        summary: "Formação dos folhetos: Ectoderma, Mesoderma e Endoderma."
                    },
                    {
                        id: "mod1_aula4",
                        title: "Aula 4: Neurulação",
                        content: `
                            <h3 class="text-xl font-bold text-emerald-700 mb-3">Neurulação</h3>
                            <p class="mb-4">Formação do tubo neural a partir do ectoderma induzido pela notocorda, originando o sistema nervoso central.</p>
                        `,
                        summary: "Tubulação do ectoderma para formar encéfalo e medula espinal."
                    },
                    {
                        id: "mod1_aula5",
                        title: "Aula 5: Organogênese",
                        content: `
                            <h3 class="text-xl font-bold text-emerald-700 mb-3">Organogênese</h3>
                            <p class="mb-4">Período de especialização celular (diferenciação) e formação dos órgãos e sistemas do corpo.</p>
                        `,
                        summary: "Diferenciação celular e especificação dos órgãos."
                    },
                    {
                        id: "mod1_aula6",
                        title: "Aula 6: Classificação Embrionária",
                        content: `
                            <h3 class="text-xl font-bold text-emerald-700 mb-3">Classificação Embrionária</h3>
                            <ul class="space-y-2 text-slate-700">
                                <li><strong>Diblásticos vs Triblásticos:</strong> 2 ou 3 folhetos embrionários.</li>
                                <li><strong>Celomados, Pseudocelomados e Acelomados:</strong> Presença e tipo de cavidade corporal.</li>
                                <li><strong>Protostômios vs Deuterostômios:</strong> Blastóporo forma boca (proto) ou ânus (deutero).</li>
                            </ul>
                        `,
                        summary: "Classificação animal por folhetos, celoma e destino do blastóporo."
                    }
                ],
                quizzes: {
                    "mod1_aula1": [{ q: "O que surge da fecundação?", options: ["Zigoto (2n)", "Gástrula", "Blástula", "Gameta"], correct: 0, explanation: "União n + n = zigoto 2n." }],
                    "mod1_aula2": [{ q: "A mórula se parece com qual fruta?", options: ["Uva", "Amora", "Maçã", "Morango"], correct: 1, explanation: "Origem do termo latim morum (amora)." }],
                    "mod1_aula3": [{ q: "Qual folheto origina os ossos e músculos?", options: ["Ectoderma", "Mesoderma", "Endoderma", "Blastocela"], correct: 1, explanation: "Mesoderma origina sistema músculo-esquelético." }],
                    "mod1_aula4": [{ q: "A neurulação forma qual estrutura?", options: ["Arquêntero", "Tubo neural", "Celoma", "Notocorda"], correct: 1, explanation: "Forma o tubo neural." }],
                    "mod1_aula5": [{ q: "A organogênese ocorre por meio de qual processo celular?", options: ["Meiose", "Diferenciação celular", "Mutação", "Fissao"], correct: 1, explanation: "Especialização por expressão gênica." }],
                    "mod1_aula6": [{ q: "Animais em que o blastóporo origina o ânus são:", options: ["Protostômios", "Deuterostômios", "Acelomados", "Diblásticos"], correct: 1, explanation: "Deuterostômios (ex: vertebrados e equinodermos)." }]
                }
            },
            2: {
                id: 2,
                title: "Platelmintos",
                icon: "fa-worm",
                color: "from-blue-500 to-indigo-600",
                description: "Vermes de corpo achatado, triblásticos e acelomados.",
                lessons: [
                    {
                        id: "mod2_aula1",
                        title: "Aula 1: Características Gerais",
                        content: `<p class="mb-4">Vermes achatados, triblásticos e <strong>acelomados</strong>. Respiração por difusão cutânea.</p>`,
                        summary: "Corpo achatado, acelomados, sem sistema respiratório."
                    },
                    {
                        id: "mod2_aula2",
                        title: "Aula 2: Classificação",
                        content: `<p class="mb-4">Turbelários (Planárias - vida livre), Trematódeos (Esquistossomo - parasitas) e Cestódeos (Tênias - sem tudo digestivo).</p>`,
                        summary: "Turbelários, Trematódeos e Cestódeos."
                    },
                    {
                        id: "mod2_aula3",
                        title: "Aula 3: Esquistossomose",
                        content: `<p class="mb-4">Causada pelo <em>Schistosoma mansoni</em>. Hospedeiro intermediário: caramujo <em>Biomphalaria</em>. Infecção por penetração ativa de cercárias na pele.</p>`,
                        summary: "Transmissão por cercárias na água via caramujo."
                    },
                    {
                        id: "mod2_aula4",
                        title: "Aula 4: Teníase e Cisticercose",
                        content: `<p class="mb-4">Teníase: ingestão de cisticercos em carne mal passada. Cisticercose: ingestão de ovos de <em>Taenia solium</em>.</p>`,
                        summary: "Teníase (carne com larva) vs Cisticercose (ovos da tênia)."
                    }
                ],
                quizzes: {
                    "mod2_aula1": [{ q: "Quanto à cavidade corporal, os platelmintos são:", options: ["Celomados", "Acelomados", "Pseudocelomados", "Diblásticos"], correct: 1, explanation: "São acelomados." }],
                    "mod2_aula2": [{ q: "Qual classe possui vida livre?", options: ["Turbelários", "Trematódeos", "Cestódeos", "Nematódeos"], correct: 0, explanation: "Turbelários (planárias)." }],
                    "mod2_aula3": [{ q: "Quem é o hospedeiro intermediário da esquistossomose?", options: ["Porco", "Boi", "Caramujo", "Mosquito"], correct: 2, explanation: "Caramujo de água doce." }],
                    "mod2_aula4": [{ q: "A cisticercose humana ocorre pela ingestão de:", options: ["Carne crua", "Ovos de Taenia solium", "Cercárias", "Caramujo"], correct: 1, explanation: "Ingestão direta dos ovos de T. solium." }]
                }
            },
            3: {
                id: 3,
                title: "Nematelmintos",
                icon: "fa-shield-virus",
                color: "from-purple-500 to-pink-600",
                description: "Vermes cilíndricos, pseudocelomados, tubo digestivo completo.",
                lessons: [
                    {
                        id: "mod3_aula1",
                        title: "Aula 1: Características Gerais",
                        content: `<p class="mb-4">Vermes de corpo <strong>cilíndrico</strong>, pseudocelomados e com tubo digestório completo (boca e ânus).</p>`,
                        summary: "Corpo cilíndrico, pseudocelomados, tubo digestivo completo."
                    },
                    {
                        id: "mod3_aula2",
                        title: "Aula 2: Ascaridíase e Ancilostomose",
                        content: `<p class="mb-4">Ascaridíase (lombriga - ingestão de ovos). Ancilostomose (amarelão - larvas penetram pela pele dos pés).</p>`,
                        summary: "Ascaridíase (ovos) e Amarelão (penetração cutânea)."
                    },
                    {
                        id: "mod3_aula3",
                        title: "Aula 3: Oxiurose e Filariose",
                        content: `<p class="mb-4">Oxiurose (coceira anal). Filariose/Elefantíase (transmissão por mosquito Culex, bloqueio linfático).</p>`,
                        summary: "Oxiurose (prurido anal) e Filariose (mosquito Culex)."
                    }
                ],
                quizzes: {
                    "mod3_aula1": [{ q: "Os nematelmintos são classificados como:", options: ["Acelomados", "Pseudocelomados", "Celomados", "Diblásticos"], correct: 1, explanation: "São pseudocelomados." }],
                    "mod3_aula2": [{ q: "Como ocorre a contaminação por Ancilostomose (amarelão)?", options: ["Ingestão de ovos", "Penetração de larvas pela pele dos pés", "Picada de mosquito", "Carne de porco"], correct: 1, explanation: "Penetração ativa de larvas pelo solo." }],
                    "mod3_aula3": [{ q: "Qual o vetor da filariose (elefantíase)?", options: ["Caramujo", "Mosquito Culex", "Barbeiro", "Mosca"], correct: 1, explanation: "Mosquito do gênero Culex." }]
                }
            }
        };

        const simulatorQuestions = [
            { q: "O zigoto é formado imediatamente após qual evento?", options: ["Clivagem", "Fecundação", "Neurulação", "Gastrulação"], correct: 1, explanation: "Fecundação gera o zigoto." },
            { q: "Em qual fase o embrião se parece com uma amora?", options: ["Blástula", "Mórula", "Gástrula", "Nêurula"], correct: 1, explanation: "Mórula." },
            { q: "Qual folheto embrionário forma a epiderme e sistema nervoso?", options: ["Endoderma", "Mesoderma", "Ectoderma", "Blastocela"], correct: 2, explanation: "Ectoderma." },
            { q: "Os platelmintos são caracterizados por possuírem corpo:", options: ["Cilíndrico", "Achatado", "Anelado", "Esférico"], correct: 1, explanation: "Vermes achatados." },
            { q: "Qual animal é um platelminto de vida livre?", options: ["Tênia", "Esquistossomo", "Planária", "Lombriga"], correct: 2, explanation: "Planária (Turbelários)." },
            { q: "O hospedeiro intermediário da esquistossomose é um:", options: ["Peixe", "Caramujo", "Mosquito", "Porco"], correct: 1, explanation: "Caramujo Biomphalaria." },
            { q: "Qual inovação no sistema digestório surge nos nematelmintos em relação aos platelmintos?", options: ["Boca", "Dentes", "Ânus (tubo completo)", "Estômago"], correct: 2, explanation: "Tubo digestivo completo com ânus." },
            { q: "O 'amarelão' é a designação popular para:", options: ["Filariose", "Ascaridíase", "Ancilostomose", "Teníase"], correct: 2, explanation: "Ancilostomose (causa anemia)." }
        ];

        function router(view, param = null) {
            window.scrollTo(0,0);
            const app = document.getElementById('app');
            if (view === 'home') renderHome(app);
            else if (view === 'modules') renderModulesHub(app);
            else if (view === 'lessons') renderModuleLessons(app, param);
            else if (view === 'lesson_detail') renderLessonDetail(app, param.modId, param.lessonIndex);
            else if (view === 'quiz') renderQuiz(app, param.modId, param.lessonId);
            else if (view === 'review') renderReview(app);
            else if (view === 'simulator') renderSimulator(app);
            else if (view === 'profile') renderProfile(app);
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="slide-up space-y-8">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-3xl p-8 sm:p-12 text-white shadow-xl relative overflow-hidden">
                        <div class="relative z-10 max-w-2xl">
                            <span class="bg-emerald-500/40 text-emerald-100 text-xs font-bold px-3 py-1 rounded-full uppercase mb-4 inline-block">Ensino Médio • Biologia</span>
                            <h2 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4">BIOLOGIA QUEST</h2>
                            <p class="text-emerald-50 text-base sm:text-lg mb-8 font-medium">Aprenda Biologia de um jeito fácil e prepare-se para sua prova escolar!</p>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="router('modules')" class="bg-white text-emerald-800 hover:bg-emerald-50 font-bold px-6 py-3.5 rounded-2xl shadow-lg transition flex items-center space-x-2">
                                    <i class="fa-solid fa-play text-emerald-600"></i>
                                    <span>COMEÇAR A APRENDER</span>
                                </button>
                                <button onclick="router('simulator')" class="bg-emerald-700/60 hover:bg-emerald-700 text-white font-bold px-6 py-3.5 rounded-2xl transition">
                                    SIMULADO
                                </button>
                                <button onclick="router('review')" class="bg-teal-700/60 hover:bg-teal-700 text-white font-bold px-5 py-3.5 rounded-2xl transition">
                                    REVISÃO RÁPIDA
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div onclick="router('lessons', 1)" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-emerald-400 transition">
                            <i class="fa-solid fa-dna text-3xl text-emerald-600 mb-3"></i>
                            <h3 class="font-bold text-lg text-slate-800">Desenvolvimento Embrionário</h3>
                            <p class="text-sm text-slate-500 mt-1">Fecundação, clivagem, gastrulação e organogênese.</p>
                        </div>
                        <div onclick="router('lessons', 2)" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-blue-400 transition">
                            <i class="fa-solid fa-worm text-3xl text-blue-600 mb-3"></i>
                            <h3 class="font-bold text-lg text-slate-800">Platelmintos</h3>
                            <p class="text-sm text-slate-500 mt-1">Vermes achatados, teníase, cisticercose e esquistossomose.</p>
                        </div>
                        <div onclick="router('lessons', 3)" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-purple-400 transition">
                            <i class="fa-solid fa-shield-virus text-3xl text-purple-600 mb-3"></i>
                            <h3 class="font-bold text-lg text-slate-800">Nematelmintos</h3>
                            <p class="text-sm text-slate-500 mt-1">Vermes cilíndricos, lombriga, amarelão e elefantíase.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderModulesHub(container) {
            container.innerHTML = `
                <div class="slide-up space-y-6">
                    <button onclick="router('home')" class="text-slate-500 hover:text-slate-800 text-sm font-semibold mb-2">← Voltar</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">Módulos de Aprendizado</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${[1, 2, 3].map(id => `
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xl font-bold text-slate-800">${modulesData[id].title}</h3>
                                    <p class="text-sm text-slate-600 mt-2">${modulesData[id].description}</p>
                                </div>
                                <button onclick="router('lessons', ${id})" class="mt-6 w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition">Acessar Aulas</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderModuleLessons(container, modId) {
            const mod = modulesData[modId];
            container.innerHTML = `
                <div class="slide-up max-w-4xl mx-auto space-y-6">
                    <button onclick="router('modules')" class="text-slate-500 hover:text-slate-800 text-sm font-semibold">← Voltar aos Módulos</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">${mod.title}</h2>
                    <div class="space-y-3">
                        ${mod.lessons.map((lesson, idx) => `
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <h4 class="font-bold text-slate-800">${lesson.title}</h4>
                                    <p class="text-xs text-slate-500">${lesson.summary}</p>
                                </div>
                                <button onclick="router('lesson_detail', { modId: ${modId}, lessonIndex: ${idx} })" class="px-4 py-2 bg-emerald-100 text-emerald-800 font-bold rounded-xl text-sm hover:bg-emerald-200 transition">Estudar</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderLessonDetail(container, modId, lessonIndex) {
            const lesson = modulesData[modId].lessons[lessonIndex];
            container.innerHTML = `
                <div class="slide-up max-w-3xl mx-auto space-y-6">
                    <button onclick="router('lessons', ${modId})" class="text-slate-500 hover:text-slate-800 text-sm font-semibold">← Voltar</button>
                    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                        <h2 class="text-2xl font-extrabold text-slate-800">${lesson.title}</h2>
                        <div class="text-slate-700 leading-relaxed">${lesson.content}</div>
                        <button onclick="router('quiz', { modId: ${modId}, lessonId: '${lesson.id}' })" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl transition">Fazer Quiz (+30 XP)</button>
                    </div>
                </div>
            `;
        }

        let currentQuizQuestions = [], currentQuizIndex = 0, currentQuizScore = 0, activeModId = null, activeLessonId = null;

        function renderQuiz(container, modId, lessonId) {
            activeModId = modId; activeLessonId = lessonId;
            currentQuizQuestions = modulesData[modId].quizzes[lessonId] || [];
            currentQuizIndex = 0; currentQuizScore = 0;
            renderQuizQuestion(container);
        }

        function renderQuizQuestion(container) {
            if (currentQuizIndex >= currentQuizQuestions.length) {
                if (currentQuizScore >= 1 && !state.completedLessons.includes(activeLessonId)) {
                    state.completedLessons.push(activeLessonId);
                    addXP(30);
                }
                container.innerHTML = `
                    <div class="slide-up max-w-xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-6">
                        <h3 class="text-2xl font-extrabold text-slate-800">Quiz Finalizado!</h3>
                        <p class="text-slate-600">Você acertou ${currentQuizScore} de ${currentQuizQuestions.length} questões.</p>
                        <button onclick="router('lessons', ${activeModId})" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">Voltar às Aulas</button>
                    </div>
                `;
                return;
            }
            const q = currentQuizQuestions[currentQuizIndex];
            container.innerHTML = `
                <div class="slide-up max-w-2xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 space-y-6">
                    <h3 class="text-lg font-bold text-slate-800">${q.q}</h3>
                    <div class="space-y-3">
                        ${q.options.map((opt, idx) => `
                            <button onclick="checkAnswer(${idx})" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-emerald-50 transition">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAnswer(idx) {
            const q = currentQuizQuestions[currentQuizIndex];
            if (idx === q.correct) currentQuizScore++;
            currentQuizIndex++;
            renderQuizQuestion(document.getElementById('app'));
        }

        function renderReview(container) {
            container.innerHTML = `
                <div class="slide-up max-w-4xl mx-auto space-y-6">
                    <button onclick="router('home')" class="text-slate-500 font-semibold text-sm">← Voltar</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">Revisão Rápida</h2>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200">
                        <h3 class="font-bold text-lg text-slate-800 mb-3">Tabela Comparativa</h3>
                        <p class="text-sm text-slate-600"><strong>Platelmintos:</strong> Vermes achatados, acelomados, tudo digestivo incompleto/ausente.</p>
                        <p class="text-sm text-slate-600 mt-2"><strong>Nematelmintos:</strong> Vermes cilíndricos, pseudocelomados, tubo digestivo completo com ânus.</p>
                    </div>
                </div>
            `;
        }

        function renderSimulator(container) {
            container.innerHTML = `
                <div class="slide-up max-w-2xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 space-y-6">
                    <button onclick="router('home')" class="text-slate-500 font-semibold text-sm">← Voltar</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">Simulado de Biologia</h2>
                    <p class="text-slate-600">Teste seus conhecimentos gerais com 8 questões simuladas de provas.</p>
                    <button onclick="startSim()" class="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl">Iniciar Simulado</button>
                </div>
            `;
        }

        let simIdx = 0, simScore = 0;
        function startSim() {
            simIdx = 0; simScore = 0;
            renderSimStep(document.getElementById('app'));
        }

        function renderSimStep(container) {
            if (simIdx >= simulatorQuestions.length) {
                container.innerHTML = `
                    <div class="slide-up max-w-xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4">
                        <h3 class="text-2xl font-extrabold text-slate-800">Resultado do Simulado</h3>
                        <p class="text-lg">Nota: <strong class="text-emerald-600">${((simScore/simulatorQuestions.length)*10).toFixed(1)} / 10</strong></p>
                        <button onclick="router('home')" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl">Voltar ao Início</button>
                    </div>
                `;
                return;
            }
            const q = simulatorQuestions[simIdx];
            container.innerHTML = `
                <div class="slide-up max-w-2xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 space-y-6">
                    <span class="text-xs font-bold text-slate-400">Questão ${simIdx + 1} de ${simulatorQuestions.length}</span>
                    <h3 class="text-lg font-bold text-slate-800">${q.q}</h3>
                    <div class="space-y-3">
                        ${q.options.map((opt, idx) => `
                            <button onclick="ansSim(${idx})" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-emerald-50 transition">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function ansSim(idx) {
            if (idx === simulatorQuestions[simIdx].correct) simScore++;
            simIdx++;
            renderSimStep(document.getElementById('app'));
        }

        function renderProfile(container) {
            container.innerHTML = `
                <div class="slide-up max-w-md mx-auto bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4">
                    <i class="fa-solid fa-graduation-cap text-5xl text-emerald-600"></i>
                    <h2 class="text-2xl font-extrabold text-slate-800">Seu Perfil</h2>
                    <p class="text-slate-600">Nível ${state.level} • ${state.xp} XP acumulados</p>
                    <p class="text-slate-600">Aulas concluídas: ${state.completedLessons.length}</p>
                    <button onclick="router('home')" class="w-full py-3 bg-slate-900 text-white font-bold rounded-xl">Voltar</button>
                </div>
            `;
        }

        window.onload = function() {
            loadState();
            router('home');
        };
    </script>
</body>
</html>
